name: CI/CD Verify and Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to deploy. Must match the branch chosen in "Use workflow from" above.'
        required: true
        type: choice
        options:
          - dev
          - main
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  verify:
    name: Verify (CI)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: learn_english_test
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run PHP Syntax Linter
        run: |
          find . -name "*.php" -not -path "*/vendor/*" | xargs -n 1 php -l

      - name: Run PHP Security Smoke Scan
        run: npm run security:php

      - name: Run ESLint (JS warnings)
        run: npm run lint

      - name: Run JSON Data Validator
        run: npm run validate:json

      - name: Build React App
        run: npm run build

      - name: Write Temporary Sandbox DB Config
        run: |
          cat <<EOF > db_config.php
          <?php
          define('DB_HOST', '127.0.0.1');
          define('DB_NAME', 'learn_english_test');
          define('DB_USER', 'root');
          define('DB_PASS', 'root');
          EOF

      - name: Verify Database Migrations in Sandbox
        run: php migrate.php

      - name: Notify Slack on CI Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"❌ *CI Verify Failed* for <https://github.com/Neolix-Studio/Learn-English-Interactively/commit/${{ github.sha }}|${{ github.sha }}> (branch `${{ github.ref_name }}` by ${{ github.actor }})"}' "$SLACK_WEBHOOK_URL"
          fi

      - name: Notify Slack on CI Success (PR Only)
        if: success() && github.event_name == 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ *CI Verify Passed* for PR <https://github.com/Neolix-Studio/Learn-English-Interactively/pull/${{ github.event.pull_request.number }}|#${{ github.event.pull_request.number }}> (branch `${{ github.ref_name }}` by ${{ github.actor }})"}' "$SLACK_WEBHOOK_URL"
          fi

  deploy:
    name: Deploy (CD)
    needs: verify
    # Deploys run on a push to dev/main, or on a manual dispatch that explicitly selects one of
    # them. The dispatch arm requires `target` to equal the ref the workflow was launched from,
    # so dispatching from a feature branch cannot deploy: ref_name would not match either option.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.target == 'main' || github.event.inputs.target == 'dev') &&
        github.ref_name == github.event.inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set Environment Variables
        id: vars
        run: |
          # The job's `if` already restricts this to dev and main. This case is the second line
          # of defence: it fails closed rather than sending an unexpected ref to the dev target,
          # which is what the previous `else` branch would have done.
          case "${{ github.ref_name }}" in
            main)
              echo "server_dir=lexipaws.eu/web" >> $GITHUB_OUTPUT
              echo "site_url=https://lexipaws.eu" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "server_dir=lexipaws.eu/sub/dev" >> $GITHUB_OUTPUT
              echo "site_url=https://dev.lexipaws.eu" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Refusing to deploy ref '${{ github.ref_name }}' - only dev and main are deployable."
              exit 1
              ;;
          esac

      # Build first, with no secrets in the environment. `build_release.js` copies only tracked
      # source into release/, so at this point the bundle provably contains no credentials.
      - name: Build Release Bundle
        run: |
          # `npm ci --ignore-scripts`, not `npm ci || npm install`: the `|| npm install` fallback
          # silently accepts a drifted lockfile (so a deploy could ship dependencies CI never
          # tested), and skipping install lifecycle scripts keeps a compromised transitive
          # package from executing on a runner that is about to hold deployment secrets.
          # Verified that the build is unaffected -- tsc/vite are run-scripts, not install hooks.
          npm ci --ignore-scripts
          npm run package:release

      # The artifact is captured BEFORE db_config.php is generated, so a credential file cannot
      # be present in it even momentarily. That ordering is the real guarantee; the exclusion
      # glob on the upload step is only a third layer behind it and this assertion.
      #
      # This matters because artifacts on a PUBLIC repository are downloadable by any signed-in
      # GitHub user for the whole retention window. db_config.php carries DB_PASS,
      # MIGRATION_TOKEN, CRON_SECRET, MAINTENANCE_TOKEN, GOOGLE_TTS_API_KEY, SMTP_PASS and both
      # Slack webhooks, so a single leaked artifact would be a full credential disclosure.
      - name: Assert release bundle carries no credentials
        run: |
          FOUND=$(find release \( -name 'db_config*.php' -o -name '*.env' -o -name '.env' \) -print | sort)
          if [ -n "$FOUND" ]; then
            echo "::error::Refusing to upload the release artifact - credential files found in release/:"
            echo "$FOUND"
            exit 1
          fi
          echo "Verified: no db_config*.php or .env files in release/ before upload."

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            release/
            !release/db_config.php
          retention-days: 30
          if-no-files-found: error

      # Runs only after the artifact is safely uploaded. From here on release/ holds live
      # secrets, so no step below this line may upload, print or otherwise export its contents.
      - name: Write Server Production DB Config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_FEEDBACK: ${{ secrets.SLACK_WEBHOOK_URL_FEEDBACK }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BETA_INVITES_ENABLED: ${{ secrets.BETA_INVITES_ENABLED }}
          APP_BASE_URL: ${{ steps.vars.outputs.site_url }}
          DB_CONFIG_PATH: release/db_config.php
        run: node scripts/write_db_config.js

      - name: Deploy files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.WEBSUPPORT_FTP_SERVER }}
          username: ${{ secrets.WEBSUPPORT_FTP_USERNAME }}
          password: ${{ secrets.WEBSUPPORT_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./release/
          server-dir: ${{ steps.vars.outputs.server_dir }}/
          exclude: |
            logs/**
            *.log

      - name: Run Remote Migrations
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "X-Migration-Token: $MIGRATION_TOKEN" "${{ steps.vars.outputs.site_url }}/migrate.php")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body:"
          echo "$BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      - name: Perform Post-Deploy Health Check
        run: |
          # api.php returns HTTP 200 even when db_config.php is missing (api.php:41-43) or the
          # database is unreachable (api.php:59-63), so `curl -f` alone cannot detect a broken
          # deploy. Assert on the response body instead.
          #
          # handleGetSession (api.php:911) returns {"session":null} when logged out and
          # {"session":{...}} when logged in. There is no "success" key on this endpoint --
          # asserting on one would fail every deploy on a healthy site.
          BODY=$(curl -fsS "${{ steps.vars.outputs.site_url }}/api.php?action=get_session")
          echo "Health check response: $BODY"
          if ! echo "$BODY" | grep -q '"session"'; then
            echo "::error::Health check failed - no session payload. The app is reachable but its database probably is not."
            exit 1
          fi

      - name: Notify Slack on Deploy Success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"🚀 *CD Deploy Succeeded* to staging/production for <https://github.com/Neolix-Studio/Learn-English-Interactively/commit/${{ github.sha }}|${{ github.sha }}> (branch `${{ github.ref_name }}` by ${{ github.actor }})"}' "$SLACK_WEBHOOK_URL"
          fi

      - name: Notify Slack on Deploy Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"❌ *CD Deploy Failed* for <https://github.com/Neolix-Studio/Learn-English-Interactively/commit/${{ github.sha }}|${{ github.sha }}> (branch `${{ github.ref_name }}` by ${{ github.actor }})"}' "$SLACK_WEBHOOK_URL"
          fi
